# Hệ thống Quản lý Đội xe (FleetOps) – Đề 30 – DTC245200390 – Docker Compose
name: fleetops

services:
  db:
    image: postgres:16-alpine
    container_name: fleetops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      APP_DB_USER: ${DB_USER}
      APP_DB_PASSWORD: ${DB_PASSWORD}
      MONITOR_DB_USER: ${MONITOR_DB_USER}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/00-create-roles.sh:/docker-entrypoint-initdb.d/00-create-roles.sh:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/20-grant-roles.sh:/docker-entrypoint-initdb.d/20-grant-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.00
    networks: [backend]

  webapp:
    build: ./app
    container_name: fleetops-webapp
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    networks: [frontend, backend, monitoring]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: fleetops-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports: ["127.0.0.1:5050:80"]
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./db/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db: { condition: service_healthy }
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 512m
    cpus: 0.50

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: fleetops-nginx
    restart: unless-stopped
    user: "${NGINX_UID:-101}:${NGINX_GID:-101}"
    ports: ["80:8080", "443:8443"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      webapp: { condition: service_healthy }
    networks: [frontend, monitoring]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.50

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fleetops-prometheus
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    security_opt: ["no-new-privileges:true"]
    pids_limit: 150
    mem_limit: 512m
    cpus: 0.50
    networks: [monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: fleetops-cadvisor
    restart: unless-stopped
    privileged: true
    mem_limit: 256m
    cpus: 0.50
    entrypoint:
      - /bin/sh
      - -c
      - |
        (while true; do
          for d in /var/lib/docker/containers/*; do
            [ -d "$$d" ] || continue
            id=$$(basename "$$d")
            m="/var/lib/docker/image/overlayfs/layerdb/mounts/$$id/mount-id"
            if [ ! -f "$$m" ]; then
              mkdir -p "$$(dirname "$$m")" 2>/dev/null && printf '%s' "$$id" > "$$m" 2>/dev/null || true
            fi
          done
          sleep 5
        done) &
        exec /usr/bin/cadvisor --store_container_labels=false --whitelisted_container_labels=com.docker.compose.service --docker_only=true --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:rw
      - /var/lib/docker/:/rootfs/var/lib/docker:rw
    networks: [monitoring]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    container_name: fleetops-nginx-exporter
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on: [nginx]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 50
    mem_limit: 64m
    cpus: 0.25
    networks: [monitoring]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fleetops-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${MONITOR_DB_USER}:${MONITOR_DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 50
    mem_limit: 64m
    cpus: 0.25
    networks: [backend, monitoring]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: fleetops-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 150
    mem_limit: 512m
    cpus: 0.50
    networks: [monitoring, frontend]

  loki:
    image: grafana/loki:3.2.0
    container_name: fleetops-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki
    security_opt: ["no-new-privileges:true"]
    pids_limit: 150
    mem_limit: 512m
    cpus: 0.50
    networks: [monitoring]

  promtail:
    image: grafana/promtail:3.2.0
    container_name: fleetops-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.25
    networks: [monitoring]

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge

volumes:
  pgdata:
  pgadmin:
  promdata:
  grafanadata:
  lokidata:
