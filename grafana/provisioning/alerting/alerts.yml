apiVersion: 1
contactPoints:
  - orgId: 1
    name: fleetops-webhook
    receivers:
      - uid: fleetops-webhook
        type: webhook
        settings:
          url: http://webapp:3000/internal/alert
          httpMethod: POST
policies:
  - orgId: 1
    receiver: fleetops-webhook
    group_by: ['alertname']
    group_wait: 0s
    group_interval: 30s
    repeat_interval: 1h
groups:
  - orgId: 1
    name: security
    folder: FleetOps
    interval: 10s
    rules:
      - uid: bruteforce-login
        title: Brute-force đăng nhập (>5 lần thất bại / 1 phút)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: Phat hien dau hieu brute-force trang dang nhap FleetOps, kiem tra log LOGIN_FAILED trong Loki
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({job="webapp"} |= "LOGIN_FAILED" [1m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
