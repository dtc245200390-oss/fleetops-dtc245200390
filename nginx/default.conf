# Nginx reverse proxy (nginx-unprivileged, chạy non-root, lắng nghe 8080/8443)
log_format fleetops_access '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';

limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;
limit_req_status 429;
server_tokens off;

server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;

    access_log /dev/stdout fleetops_access;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    # TLS theo khuyến nghị "Intermediate" của Mozilla
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    client_max_body_size 1m;

    # Không công khai đường dẫn nội bộ
    location /metrics  { return 404; }
    location /internal { return 404; }

    location = /api/login {
        limit_req zone=login burst=6 nodelay;
        proxy_pass http://webapp:3000;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://webapp:3000;
        include /etc/nginx/proxy_params.conf;
    }
}

# Chỉ dùng nội bộ cho nginx-exporter (không publish ra host)
server {
    listen 8081;
    location /stub_status { stub_status; allow all; }
}
